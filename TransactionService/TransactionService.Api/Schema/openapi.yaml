openapi: 3.0.1
info:
  title: TransactionService
  description: API for managing transactions and wallet recharges
  version: 1.0.0
tags:
  - name: Transactions
  - name: Recharges
paths:
  /api/transactions:
    post:
      summary: Create Transaction
      description: Creates a transfer between two wallets. Requires the User-App role.
      operationId: createTransaction
      tags:
        - Transactions
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          schema:
            type: string
            format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransactionSchemaRequest'
        required: true
      responses:
        '200':
          description: Transaction created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionSchemaIdResponse'
        '400':
          description: Bad request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden – requires User-App role
        '422':
          description: Validation error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '500':
          description: Internal server error
      security:
        - BearerAuth: []
  /api/transactions/{transactionId}:
    delete:
      summary: Delete Transaction
      description: Deletes a transaction by its identifier. Requires the Support role.
      operationId: deleteTransaction
      tags:
        - Transactions
      parameters:
        - name: transactionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Transaction deleted successfully
        '401':
          description: Unauthorized
        '403':
          description: Forbidden – requires Support role
        '404':
          description: Transaction not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '500':
          description: Internal server error
      security:
        - BearerAuth: []
  /api/transactions/wallet/{fromWalletId}:
    get:
      summary: Get Transactions by Wallet
      description: Returns all transactions originating from the given wallet. Requires the User-App role.
      operationId: getTransactions
      tags:
        - Transactions
      parameters:
        - name: fromWalletId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: List of transactions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TransactionSchemaResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden – requires User-App role
        '500':
          description: Internal server error
      security:
        - BearerAuth: []
  /api/recharges:
    post:
      summary: Create Recharge
      description: Creates a recharge for a wallet. Requires the Seller role.
      operationId: createRecharge
      tags:
        - Recharges
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          schema:
            type: string
            format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RechargeSchemaRequest'
        required: true
      responses:
        '200':
          description: Recharge created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RechargeSchemaIdResponse'
        '400':
          description: Bad request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden – requires Seller role
        '422':
          description: Validation error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '500':
          description: Internal server error
      security:
        - BearerAuth: []
  /api/recharges/{rechargeId}:
    delete:
      summary: Delete Recharge
      description: Deletes a recharge by its identifier. Requires the Support role.
      operationId: deleteRecharge
      tags:
        - Recharges
      parameters:
        - name: rechargeId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Recharge deleted successfully
        '401':
          description: Unauthorized
        '403':
          description: Forbidden – requires Support role
        '404':
          description: Recharge not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '500':
          description: Internal server error
      security:
        - BearerAuth: []
  /api/recharges/wallet/{walletId}:
    get:
      summary: Get Recharges by Wallet
      description: Returns all recharges for the given wallet. Requires Seller or User-App role.
      operationId: getRecharges
      tags:
        - Recharges
      parameters:
        - name: walletId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: List of recharges
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RechargeSchemaResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden – requires Seller or User-App role
        '500':
          description: Internal server error
      security:
        - BearerAuth: []
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    TransactionSchemaRequest:
      type: object
      properties:
        FromWalletId:
          type: string
          format: uuid
        ToWalletId:
          type: string
          format: uuid
        Amount:
          type: number
          format: double
        Currency:
          type: string
        SourceType:
          type: string
      required:
        - FromWalletId
        - ToWalletId
        - Amount
        - Currency
        - SourceType
    TransactionSchemaResponse:
      type: object
      properties:
        PaymentId:
          type: string
          format: uuid
        FromWalletId:
          type: string
          format: uuid
        ToWalletId:
          type: string
          format: uuid
        Amount:
          type: number
          format: double
        Currency:
          type: string
        SourceType:
          type: string
        CreatedAt:
          type: string
          format: date-time
      required:
        - PaymentId
        - FromWalletId
        - ToWalletId
        - Amount
        - Currency
        - SourceType
        - CreatedAt
    TransactionSchemaIdResponse:
      type: object
      properties:
        TransactionId:
          type: string
          format: uuid
      required:
        - TransactionId
    RechargeSchemaRequest:
      type: object
      properties:
        WalletId:
          type: string
          format: uuid
        Amount:
          type: number
          format: double
        Currency:
          type: string
        MethodType:
          type: string
      required:
        - WalletId
        - Amount
        - Currency
        - MethodType
    RechargeSchemaResponse:
      type: object
      properties:
        RechargeId:
          type: string
          format: uuid
        WalletId:
          type: string
          format: uuid
        Amount:
          type: number
          format: double
        Currency:
          type: string
        MethodType:
          type: string
        CreatedAt:
          type: string
          format: date-time
      required:
        - RechargeId
        - WalletId
        - Amount
        - Currency
        - MethodType
        - CreatedAt
    RechargeSchemaIdResponse:
      type: object
      properties:
        RechargeId:
          type: string
          format: uuid
      required:
        - RechargeId
    ProblemDetails:
      type: object
      properties:
        type:
          type: string
          nullable: true
        title:
          type: string
          nullable: true
        status:
          type: integer
          nullable: true
        detail:
          type: string
          nullable: true
        instance:
          type: string
          nullable: true
