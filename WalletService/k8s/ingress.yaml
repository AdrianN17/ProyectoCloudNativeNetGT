apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: walletservice
  namespace: apis
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /$2
    nginx.ingress.kubernetes.io/use-regex: "true"
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /wallet(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: walletservice
                port:
                  number: 80
