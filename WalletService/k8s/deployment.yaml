apiVersion: v1
kind: Namespace
metadata:
  name: apis
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: walletservice
  namespace: apis
  labels:
    app: walletservice
spec:
  replicas: 1
  selector:
    matchLabels:
      app: walletservice
  template:
    metadata:
      labels:
        app: walletservice
    spec:
      containers:
        - name: walletservice
          image: ACR_NAME.azurecr.io/walletservice:IMAGE_TAG
          ports:
            - containerPort: 8080
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: "Production"
            # Apuntar al servicio de tipo de cambio interno del cluster
            - name: HttpClients__ExchangeServiceBaseUrl
              value: "http://mockcurrency"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://jaeger.tracing.svc.cluster.local:4317"
            - name: OTEL_SERVICE_NAME
              value: "walletservice"
          resources:
            requests:
              cpu: "150m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: walletservice
  namespace: apis
spec:
  selector:
    app: walletservice
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080
  type: ClusterIP
