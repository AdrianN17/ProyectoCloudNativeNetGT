apiVersion: v1
kind: Namespace
metadata:
  name: apis
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mockcurrency
  namespace: apis
  labels:
    app: mockcurrency
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mockcurrency
  template:
    metadata:
      labels:
        app: mockcurrency
    spec:
      containers:
        - name: mockcurrency
          image: ACR_NAME.azurecr.io/mockcurrency:IMAGE_TAG
          ports:
            - containerPort: 8080
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: "Production"
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: mockcurrency
  namespace: apis
spec:
  selector:
    app: mockcurrency
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080
  type: ClusterIP
