name: Docker Image CI Mock Currency

on:
  workflow_dispatch:
  
jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    # Login en Azure
    - name: Azure Login
      uses: azure/login@v1
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}

    # Login al ACR
    - name: Login to ACR
      run: |
        az acr login --name ${{ secrets.ACR_NAME }}

    # Build + Tag
    - name: Build Docker image
      run: |
        IMAGE_NAME=${{ secrets.ACR_NAME }}.azurecr.io/mockcurrency
        TAG=${{ github.sha }}
        docker build --platform linux/amd64 -t $IMAGE_NAME:$TAG ./MockCurrency

    # Push
    - name: Push Docker image
      run: |
        IMAGE_NAME=${{ secrets.ACR_NAME }}.azurecr.io/mockcurrency
        TAG=${{ github.sha }}
        docker push $IMAGE_NAME:$TAG

    # Instalar kubelogin (requerido para clusters AKS con AAD)
    - name: Install kubelogin
      uses: azure/use-kubelogin@v1
      with:
        kubelogin-version: 'v0.1.4'

    # Conectar al AKS
    - name: Set AKS context
      uses: azure/aks-set-context@v3
      with:
        resource-group: ${{ secrets.AKS_RESOURCE_GROUP }}
        cluster-name: ${{ secrets.AKS_CLUSTER_NAME }}

    # Convertir kubeconfig para usar el token del Azure CLI (evita auth interactiva de AAD)
    - name: Convert kubeconfig
      run: kubelogin convert-kubeconfig -l azurecli

    # Sustituir imagen en el manifiesto y aplicar
    - name: Deploy to AKS
      run: |
        IMAGE_NAME=${{ secrets.ACR_NAME }}.azurecr.io/mockcurrency
        TAG=${{ github.sha }}
        sed "s|ACR_NAME.azurecr.io/mockcurrency:IMAGE_TAG|$IMAGE_NAME:$TAG|g" \
          ./MockCurrency/k8s/deployment.yaml | kubectl apply -f -
