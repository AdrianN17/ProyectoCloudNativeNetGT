name: Docker Image CI Wallet

on:
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    # Login en Azure
    - name: Azure Login
      uses: azure/login@v1
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}

    # Login al ACR
    - name: Login to ACR
      run: |
        az acr login --name ${{ secrets.ACR_NAME }}

    # Emulación ARM64 en el runner amd64
    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    # Build + Tag
    - name: Build and push Docker image
      run: |
        IMAGE_NAME=${{ secrets.ACR_NAME }}.azurecr.io/walletservice
        TAG=${{ github.sha }}
        docker buildx build \
          --platform linux/amd64 \
          -t $IMAGE_NAME:$TAG \
          --progress=plain \
          --push \
          ./WalletService

