apiVersion: v1
kind: Namespace
metadata:
  name: apis
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: transactionservice
  namespace: apis
  labels:
    app: transactionservice
spec:
  replicas: 1
  selector:
    matchLabels:
      app: transactionservice
  template:
    metadata:
      labels:
        app: transactionservice
        # Activa la inyección automática de credenciales por el Workload Identity webhook
        azure.workload.identity/use: "true"
    spec:
      serviceAccountName: workload-identity-sa
      imagePullSecrets:
        - name: acr-secret
      containers:
        - name: transactionservice
          # Sustituido por deploy.sh con ACR_NAME e IMAGE_TAG
          image: __ACR_NAME__.azurecr.io/transactionservice:__IMAGE_TAG__
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: "Production"
            - name: HttpClients__ExchangeServiceBaseUrl
              value: "http://mockcurrency"
            - name: HttpClients__WalletServiceBaseUrl
              value: "http://walletservice"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://jaeger.tracing.svc.cluster.local:4317"
            - name: OTEL_SERVICE_NAME
              value: "transactionservice"
            # AZURE_CLIENT_ID, AZURE_TENANT_ID y AZURE_FEDERATED_TOKEN_FILE
            # son inyectados automáticamente por el workload-identity-webhook
          resources:
            requests:
              cpu: "150m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: transactionservice
  namespace: apis
spec:
  selector:
    app: transactionservice
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 8080
  type: ClusterIP
